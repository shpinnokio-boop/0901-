<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="강아지의 기록 회원가입"><title>회원가입 | 강아지의 기록</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body class="auth-body"><a class="skip-link" href="#main-content">본문으로 바로가기</a><header class="simple-header"><a class="brand" href="index.html"><span>G</span> 강아지의 기록</a><a href="login.html">이미 계정이 있나요? <strong>로그인</strong></a></header><main id="main-content" class="auth-main"><section class="auth-card wide"><div class="auth-heading"><p class="eyebrow">JOIN THE JOURNEY</p><h1>기록을 함께<br>시작해요.</h1><p>좋아하는 글을 저장하고 새로운 이야기를 가장 먼저 만나보세요.</p></div><form class="form-stack demo-form" data-message="회원가입 화면 구성이 완료되었습니다."><div class="field"><label for="signup-name">이름</label><input id="signup-name" name="name" type="text" placeholder="이름을 입력하세요" autocomplete="name" required></div><div class="field"><label for="signup-email">이메일</label><input id="signup-email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required></div><div class="field"><label for="signup-password">비밀번호</label><input id="signup-password" name="password" type="password" placeholder="8자 이상 입력하세요" autocomplete="new-password" minlength="8" required><small>영문, 숫자를 포함해 8자 이상 입력해 주세요.</small></div><label class="check-row"><input type="checkbox" required><span><a href="#">이용약관</a>과 <a href="#">개인정보 처리방침</a>에 동의합니다.</span></label><button class="primary-button" type="submit">회원가입</button><p class="form-status" role="status" aria-live="polite"></p></form><p class="auth-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p></section></main></body></html>
